[project]
name = "liminal-training"
version = "1.0.0"
description = "Liminal training: annealed KL-regularized fine-tuning for mitigating subliminal learning"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Atsushi Yanagisawa" },
    { name = "Brendan Gho" },
    { name = "Rajendran Ramesh Babu Manoj Narender" },
    { name = "Kevin Zhu" },
    { name = "Antonio Mari" },
]
dependencies = [
    "loguru>=0.7.3",
    "numpy>=1.24.0",
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "datasets>=2.18.0",
    "trl>=0.8.0",
    "accelerate>=0.28.0",
    "tqdm>=4.66.0",
    "pydantic>=2.0.0",
    "openai>=2.15.0",
    "python-dotenv>=1.0.0",
    "scipy>=1.17.0",
    "matplotlib>=3.10.8",
]

[project.urls]
Repository = "https://github.com/BrendanGho/liminal"

# Discovered rather than hand-listed: the previous explicit list had drifted and
# omitted sl.finetuning, which every module in cfgs/ imports.
[tool.setuptools.packages.find]
include = ["sl*", "cfgs*"]

[build-system]
# setuptools>=77 is required for the PEP 639 SPDX `license` string above.
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "ipython>=9.4.0",
    "pytest>=8.4.1",
    "ruff>=0.12.4",
]
# GPU/Linux-only. Required to fine-tune open models and to serve them for
# evaluation; not installed by a plain `uv sync`.
training = [
    "unsloth[colab-new]>=2026.1.3",
    "vllm>=0.13.0",
    "bitsandbytes>=0.45.0",
    "langdetect>=1.0.9",
]
